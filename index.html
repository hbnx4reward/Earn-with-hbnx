<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Earn With HBNX</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,Tahoma,sans-serif;
    background:#07111f;
    color:#fff;
    min-height:100vh;
}
button,input{font:inherit}
button{cursor:pointer;border:0}

.container{
    width:min(1100px,94%);
    margin:auto;
}

header{
    background:#0b1728;
    border-bottom:1px solid #1b3048;
    padding:16px 0;
    position:sticky;
    top:0;
    z-index:10;
}

.nav{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:15px;
}

.logo{
    font-size:22px;
    font-weight:bold;
    color:#35d0ff;
}

.logo span{color:#fff}

.nav button{
    background:#15263b;
    color:#fff;
    padding:10px 15px;
    border-radius:10px;
}

.hero{
    text-align:center;
    padding:55px 15px 35px;
}

.hero h1{
    font-size:38px;
    margin-bottom:12px;
}

.hero h1 span{color:#35d0ff}

.hero p{
    color:#9db0c5;
    line-height:1.8;
}

.btn{
    background:#20b8e8;
    color:#00111a;
    padding:13px 22px;
    border-radius:11px;
    font-weight:bold;
    margin-top:20px;
}

.btn:hover{opacity:.9}

.page{display:none}
.page.active{display:block}

.card{
    background:#0d1b2c;
    border:1px solid #1c344d;
    border-radius:17px;
    padding:20px;
    margin-bottom:18px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:16px;
}

.stat{
    background:#101f32;
    padding:20px;
    border-radius:15px;
    border:1px solid #1c344d;
}
